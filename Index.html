<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Monstruos - Firebase</title>
    <!-- Tailwind CSS para un diseño limpio y responsivo -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans flex items-center justify-center">

    <div class="max-w-xl w-full p-6 bg-slate-800 rounded-xl shadow-xl border border-slate-700">
        <h1 class="text-2xl font-bold mb-6 text-emerald-400 text-center">Registrar Nuevo Monstruo</h1>

        <!-- Formulario de publicación -->
        <form id="monstruoForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Nombre del Monstruo:</label>
                <input type="text" id="nombre" required 
                    class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 text-white"
                    placeholder="Ej. Goblin Guerrero">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Tipo / Categoría:</label>
                <input type="text" id="tipo" required 
                    class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 text-white"
                    placeholder="Ej. Humanoide, Bestia">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">Puntos de Vida (HP):</label>
                    <input type="number" id="hp" required 
                        class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 text-white"
                        placeholder="50">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">Ataque:</label>
                    <input type="number" id="ataque" required 
                        class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 text-white"
                        placeholder="12">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Descripción:</label>
                <textarea id="descripcion" rows="3" 
                    class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 text-white"
                    placeholder="Detalles sobre el monstruo..."></textarea>
            </div>

            <button type="submit" id="btnPublicar"
                class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-lg transition-colors cursor-pointer text-white shadow-lg">
                Publicar Monstruo
            </button>
        </form>

        <!-- Mensaje de estado -->
        <div id="estadoMensaje" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <!-- Script de Firebase y Lógica -->
    <script type="module">
        // Importa los SDKs necesarios de Firebase (versión modular 10+)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: Reemplaza estos datos con la configuración real de tu proyecto de Firebase
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO_ID",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Capturar el envío del formulario
        const formulario = document.getElementById('monstruoForm');
        const estadoMensaje = document.getElementById('estadoMensaje');

        formulario.addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue por defecto

            const btn = document.getElementById('btnPublicar');
            btn.disabled = true;
            btn.textContent = "Publicando...";
            estadoMensaje.textContent = "";

            try {
                // Recoger los valores del formulario
                const nuevoMonstruo = {
                    nombre: document.getElementById('nombre').value,
                    tipo: document.getElementById('tipo').value,
                    hp: Number(document.getElementById('hp').value),
                    ataque: Number(document.getElementById('ataque').value),
                    descripcion: document.getElementById('descripcion').value,
                    fechaCreacion: new Date()
                };

                // Guardar en la colección "monstruos" de Firestore
                await addDoc(collection(db, "monstruos"), nuevoMonstruo);

                // Éxito
                estadoMensaje.className = "mt-4 text-center text-sm font-medium text-emerald-400";
                estadoMensaje.textContent = "¡Monstruo publicado con éxito en Firestore!";
                formulario.reset(); // Limpiar campos

            } catch (error) {
                console.error("Error al publicar:", error);
                estadoMensaje.className = "mt-4 text-center text-sm font-medium text-red-400";
                estadoMensaje.textContent = "Hubo un error al publicar. Revisa la consola.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Publicar Monstruo";
            }
        });
    </script>
</body>
</html>
